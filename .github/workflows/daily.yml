name: daily-puzzles

on:
  schedule:
    # 12:00 UTC daily (after US papers publish); plus a catch-up run 12h later
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  solve-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OCR deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rebuild -> target

      - name: Build solver
        run: cargo build --release --bin solve_one --manifest-path rebuild/Cargo.toml

      - name: Fetch puzzle assets
        run: |
          pip install --quiet beautifulsoup4 pillow 2>/dev/null || true
          python3 pipeline/scripts/fetch.py > /tmp/manifest.json
          cat /tmp/manifest.json

      - name: OCR + parse
        run: python3 pipeline/scripts/ocr_parse.py /tmp/manifest.json > /tmp/puzzles.json

      - name: Solve + review + publish
        run: >
          python3 pipeline/scripts/solve_all.py /tmp/puzzles.json
          --solver rebuild/target/release/solve_one

      - name: Commit results
        run: |
          git config user.name "puzzle-bot"
          git config user.email "puzzle-bot@users.noreply.github.com"
          git add pipeline/results/ || true
          git diff --cached --quiet || git commit -m "daily answers $(date -u +%F)"
          git push

      - name: Upload pipeline debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug-${{ github.run_id }}
          path: |
            /tmp/puzzle_manifest.json
            /tmp/puzzles.json
          retention-days: 7
